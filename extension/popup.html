<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #1a1a1a;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .status.connected {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .status.disconnected {
      background: #fce4ec;
      color: #c62828;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .connected .dot { background: #4caf50; }
    .disconnected .dot { background: #f44336; }
    .info {
      font-size: 11px;
      color: #888;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .version {
      font-size: 10px;
      color: #aaa;
      margin-top: 8px;
      text-align: right;
    }
    button {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #f5f5f5;
      color: #333;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #eee; }
  </style>
</head>
<body>
  <h1>Claude Code Browser Bridge</h1>
  <div id="status" class="status disconnected">
    <span class="dot"></span>
    <span id="statusText">Disconnected</span>
  </div>

  <div class="info">
    Scans ports 17890-17909 for MCP servers.<br>
    Trusted CDP input &middot; full DevTools Protocol access.<br>
    v3.4.0: OOPIF iframe sessions &middot; downloads &middot; clipboard
    &middot; multi-window &middot; network mocking.
  </div>
  <form id="pairForm">
    <label for="bridgeToken">Pairing token (from your local server)</label>
    <input id="bridgeToken" type="password" autocomplete="off" spellcheck="false" placeholder="64 hex characters" style="width:100%;margin:8px 0;padding:6px">
    <button type="submit">Save pairing token</button>
    <button id="unpair" type="button">Unpair and disconnect</button>
    <p id="pairStatus" role="status" style="margin:8px 0"></p>
  </form>
  <button id="retry">Scan &amp; Reconnect</button>
  <div class="version">v3.4.0</div>
  <script src="popup.js"></script>
</body>
</html>
