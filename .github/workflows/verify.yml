name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install server dependencies
        run: npm ci --ignore-scripts
        working-directory: server
      - name: Type and security checks
        run: npm run check && npm run test:security && npm audit --audit-level=low
        working-directory: server
      - name: Install browser tests
        run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
        working-directory: verify
      - name: Browser acceptance and dependency audit
        run: npm test && npm audit --audit-level=low
        working-directory: verify
